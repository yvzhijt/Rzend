<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rzend</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部菜单栏 -->
    <div id="ribbon">
      <div class="menu-bar">
        <!-- 文件 -->
        <div class="menu" id="menu-file">
          <button class="menu-btn" type="button">文件</button>
          <div class="menu-dropdown">
            <button class="menu-item" id="mi-open-folder"><span>打开文件夹…</span><span class="menu-hotkey">Ctrl+O</span></button>
            <button class="menu-item" id="mi-save"><span>保存</span><span class="menu-hotkey">Ctrl+S</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="mi-refresh">刷新文件夹</button>
            <button class="menu-item" id="mi-folder-up">上级目录</button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="mi-toggle-folder">文件夹面板</button>
            <button class="menu-item" id="mi-toggle-workspace">工作区面板</button>
          </div>
        </div>
        <!-- 编辑 -->
        <div class="menu" id="menu-edit">
          <button class="menu-btn" type="button">编辑</button>
          <div class="menu-dropdown">
            <button class="menu-item" id="mi-clear-cmd"><span>清空命令行</span><span class="menu-hotkey">clc</span></button>
            <button class="menu-item" id="mi-clear-ws"><span>清空工作区</span><span class="menu-hotkey">clear</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="mi-terminal"><span>切换终端</span><span class="menu-hotkey">Ctrl+`</span></button>
            <div class="menu-sep"></div>
            <div class="menu-item has-submenu">
              <span>字体大小</span><span class="font-arrow">▸</span>
              <div class="menu-dropdown">
                <div class="font-submenu-body" id="font-submenu-body">
                  <div class="font-row"><span>字号偏移</span><strong id="font-value">默认</strong></div>
                  <input type="range" id="font-range" min="-10" max="10" step="1" value="0" />
                  <div class="font-presets">
                    <button type="button" class="menu-item" data-font="-10">最小（−10）</button>
                    <button type="button" class="menu-item" data-font="-5">较小（−5）</button>
                    <button type="button" class="menu-item" data-font="0">默认</button>
                    <button type="button" class="menu-item" data-font="5">较大（+5）</button>
                    <button type="button" class="menu-item" data-font="10">最大（+10）</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 仿真 -->
        <div class="menu" id="menu-sim">
          <button class="menu-btn" type="button">仿真</button>
          <div class="menu-dropdown">
            <button class="menu-item" id="mi-circuit">电气系统</button>
            <button class="menu-item" id="mi-signal">信号系统</button>
          </div>
        </div>
      </div>
      <div class="ribbon-right">
        <span class="ribbon-title">Rzend</span>
      </div>
    </div>

    <!-- 主工作区 -->
    <div id="main-area">
      <!-- 左侧：当前文件夹 -->
      <div id="folder-panel">
        <div class="panel-header">
          <span class="panel-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>当前文件夹</span>
          <div class="panel-actions">
            <button class="panel-icon-btn" id="btn-refresh" title="刷新">↻</button>
            <button class="panel-icon-btn" id="btn-folder-up" title="上级目录">↑</button>
          </div>
        </div>
        <div id="folder-path-bar"><span id="current-folder-path"></span></div>
        <div id="file-tree" class="file-tree"></div>
      </div>

      <div class="splitter" id="split-left"></div>

      <!-- 中间：编辑器（可折叠）+ 命令行 -->
      <div id="center-area">
        <!-- 简易编辑器（默认隐藏） -->
        <div id="editor-panel" class="hidden">
          <div id="editor-toolbar">
            <span class="panel-drag" title="拖动以移动面板">⠿</span>
            <span id="editor-filename"></span>
            <span id="editor-modified" class="hidden">● 已修改</span>
            <div class="editor-toolbar-actions">
              <button id="btn-save-file" class="toolbar-btn" title="保存 (Ctrl+S)">💾 保存</button>
              <button id="btn-run-file" class="toolbar-btn" title="仅运行 .yt 文件">▶ 运行</button>
              <button id="btn-close-file" class="toolbar-btn" title="关闭">✕</button>
            </div>
          </div>
          <div class="editor-container">
            <div id="editor-host"></div>
            <div id="image-preview" class="hidden">
              <div id="image-tools">
                <div class="image-tool-row">
                  <label>裁剪 x <input id="image-crop-x" type="number" min="0" value="0"></label>
                  <label>y <input id="image-crop-y" type="number" min="0" value="0"></label>
                  <label>宽 <input id="image-crop-width" type="number" min="1"></label>
                  <label>高 <input id="image-crop-height" type="number" min="1"></label>
                  <button id="image-crop-apply" class="toolbar-btn">裁剪</button>
                </div>
                <div class="image-tool-row">
                  <label>缩放宽 <input id="image-resize-width" type="number" min="1"></label>
                  <label>高 <input id="image-resize-height" type="number" min="1"></label>
                  <button id="image-resize-apply" class="toolbar-btn">缩放</button>
                  <button id="image-rotate-left" class="toolbar-btn" title="逆时针旋转 90°">↶ 90°</button>
                  <button id="image-rotate-right" class="toolbar-btn" title="顺时针旋转 90°">↷ 90°</button>
                  <select id="image-filter" aria-label="图片滤镜">
                    <option value="">选择滤镜</option>
                    <option value="grayscale">灰度</option>
                    <option value="blur">模糊</option>
                    <option value="sharpen">锐化</option>
                    <option value="brighten">增亮</option>
                    <option value="darken">变暗</option>
                    <option value="contrast">增强对比度</option>
                    <option value="invert">反色</option>
                  </select>
                  <button id="image-filter-apply" class="toolbar-btn">应用滤镜</button>
                  <button id="image-reset" class="toolbar-btn">重置</button>
                  <button id="image-save-as" class="toolbar-btn">另存为</button>
                </div>
              </div>
              <img id="preview-image" alt="图片预览" />
              <div id="preview-image-info"></div>
            </div>
          </div>
        </div>
        <div class="splitter-v" id="split-editor"></div>

        <!-- 底部堆叠区：命令行与终端相互覆盖，共用同一块区域 -->
        <div id="bottom-stack">
        <!-- 命令行窗口 -->
        <div id="command-window">
          <div class="cmd-header">
            <span class="cmd-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>命令行窗口</span>
            <div class="cmd-actions">
              <button class="panel-icon-btn" id="btn-terminal-switch" title="切换到终端 (cmd / 反引号)">⌨</button>
              <button class="panel-icon-btn" id="btn-clear-cmd" title="清空命令行 (clc)">🗑</button>
            </div>
          </div>
          <div id="cmd-scroll">
            <div id="cmd-output"></div>
            <div id="cmd-input-line">
              <span class="cmd-prompt" id="cmd-prompt">&gt;&gt;</span>
              <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" />
            </div>
          </div>
        </div>

        <!-- 内嵌终端（PowerShell）：输入 cmd 唤出，cwd 与文件树双向同步 -->
        <div id="terminal-panel" class="hidden">
          <div class="cmd-header terminal-header">
            <span class="cmd-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>终端<span id="terminal-shell" class="terminal-shell"></span><span id="terminal-cwd" class="terminal-cwd"></span></span>
            <div class="cmd-actions">
              <button class="panel-icon-btn" id="btn-cmd-switch" title="切换到命令行">&gt;_</button>
              <button class="panel-icon-btn" id="btn-terminal-close" title="隐藏终端（会话保留）">✕</button>
            </div>
          </div>
          <div id="terminal-container"></div>
        </div>
        </div><!-- /bottom-stack -->
      </div>

      <div class="splitter" id="split-right"></div>

      <!-- 右侧：工作区 -->
      <div id="workspace-panel">
        <div class="panel-header">
          <span class="panel-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>工作区</span>
          <div class="panel-actions">
            <button class="panel-icon-btn" id="btn-clear-workspace" title="清空工作区 (clear)">🗑</button>
          </div>
        </div>
        <div id="workspace-content">
          <div class="workspace-section-header">
            名称<span class="ws-header-value">值</span><span class="ws-header-type">类型</span><span class="ws-header-size">大小</span>
          </div>
          <div id="workspace-vars"></div>
        </div>
      </div>
    </div>

    <div id="scope-window" class="hidden">
      <div id="scope-head">
        <span class="scope-title" id="scope-title">示波器</span>
        <span id="scope-sub"></span>
        <button id="scope-reset" title="复位视图">复位</button>
        <button id="scope-close" title="关闭">✕</button>
      </div>
      <canvas id="scope-canvas"></canvas>
      <div id="scope-legend"></div>
    </div>



    <!-- 状态栏 -->
    <div id="statusbar">
      <div class="statusbar-left">
        <span id="status-indicator" class="status-item">就绪</span>
      </div>
      <div class="statusbar-right">
        <span id="status-folder" class="status-item"></span>
        <span class="status-separator">|</span>
        <span class="status-item">Rzend v0.2.0</span>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
