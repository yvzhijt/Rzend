<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rzend 信号系统仿真</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="circuit-view">
    <div id="circ-toolbar">
      <span class="sim-title">信号系统仿真</span>
      <div class="sim-mode-group">
        <button class="toolbar-btn accent" id="circ-run" title="计算传递函数并在示波器显示时域响应">▶ 仿真</button>
        <label class="sim-field" style="margin-left:8px;font-size:12px">仿真时间
          <input id="sig-sim-time" type="number" value="10" min="0.1" step="1"
            style="width:60px;margin-left:4px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm)">
          <span style="font-size:11px;color:var(--text-dim)">s</span>
        </label>
        <label class="sim-field" style="margin-left:10px;font-size:12px">采样周期 Ts
          <input id="sig-ts" type="number" value="1" min="0.01" step="0.5"
            style="width:54px;margin-left:4px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm)">
          <span style="font-size:11px;color:var(--text-dim)">s</span>
        </label>
      </div>
      <details class="sim-settings">
        <summary>⚙ 设置</summary>
        <label class="sim-field">文件格式
          <span style="font-size:11px;color:var(--text-dim);margin-left:4px">信号流图 (*.sig)</span>
        </label>
      </details>
      <span class="sim-sep"></span>
      <button class="toolbar-btn" id="sig-save">💾 保存</button>
      <button class="toolbar-btn" id="sig-save-as">💾 另存为</button>
      <button class="toolbar-btn" id="sig-open">📂 打开</button>
      <button class="toolbar-btn" id="sig-clear">清空</button>
      <span class="sim-status" id="circ-status">就绪</span>
      <button class="toolbar-btn sim-close" id="sig-close">✕ 关闭窗口</button>
    </div>
    <div id="circ-body">
      <div id="circ-palette">
        <div class="panel-header sig-palette-header">
          <span class="panel-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>节点库</span>
        </div>
        <input id="circ-search" class="circ-search" type="text" placeholder="搜索节点" autocomplete="off">
        <div id="circ-palette-list"></div>
      </div>
      <div id="circ-canvas-wrap">
        <svg id="circ-canvas">
          <defs>
            <pattern id="circ-grid-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
              <circle cx="6" cy="6" r="1" fill="#d4d4d4" />
            </pattern>
            <marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 Z" fill="#3976a8" />
            </marker>
          </defs>
          <rect id="circ-grid-bg" x="0" y="0" width="100%" height="100%" fill="url(#circ-grid-pattern)" />
          <g id="signal-wires-layer"></g>
          <g id="signal-temp-layer"></g>
          <g id="signal-elements-layer"></g>
        </svg>
        <div id="circ-empty" class="circ-empty hidden">画布为空 · 在左侧搜索节点后点击添加</div>
      </div>
      <div id="circ-props">
        <div class="panel-header"><span class="panel-title"><span class="panel-drag" title="拖动以移动面板">⠿</span>节点属性</span></div>
        <div id="circ-props-body"><div class="placeholder-content">选中一个节点</div></div>
      </div>
    </div>

    <div id="scope-window" class="hidden">
      <div id="scope-head">
        <span class="scope-title" id="scope-title">示波器</span>
        <span id="scope-sub"></span>
        <button id="scope-reset" title="复位视图">复位</button>
        <button id="scope-close" title="关闭">✕</button>
      </div>
      <canvas id="scope-canvas"></canvas>
      <div id="scope-legend"></div>
    </div>

    <div id="circ-context-menu" class="circ-context-menu hidden" role="menu">
      <button type="button" role="menuitem" data-action="edit-tf">编辑传递函数</button>
      <button type="button" role="menuitem" data-action="add-input">添加输入端</button>
      <button type="button" role="menuitem" data-action="remove-input">移除输入端</button>
      <button type="button" role="menuitem" data-action="delete-sg">删除节点</button>
    </div>
  </div>

  <script type="module" src="/src/sig.js"></script>
</body>
</html>
